<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>每週爆谷評價</title>
<style>
  :root {
    --bg: #fff;
    --ink: #000;
    --muted: #555;
    --line: #000;
    --soft: #f2f2f2;
    --max: 820px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Helvetica Neue", Helvetica, Arial, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    line-height: 1.5;
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--ink); text-underline-offset: 2px; }
  a:hover { opacity: 0.6; }

  .masthead {
    max-width: var(--max);
    margin: 0 auto;
    padding: 36px 20px 0;
  }
  .wordmark {
    margin: 0;
    font-size: clamp(2rem, 5vw, 3.2rem);
    font-weight: 700;
    letter-spacing: -0.04em;
    line-height: 1.05;
  }
  .lede {
    margin: 10px 0 18px;
    font-size: 13px;
    color: var(--muted);
  }
  hr.rule {
    border: 0;
    border-top: 1px solid var(--line);
    margin: 0;
  }
  hr.thick {
    border: 0;
    border-top: 4px solid #000;
    margin: 28px 0 8px;
  }

  main {
    max-width: var(--max);
    margin: 0 auto;
    padding: 8px 20px 64px;
  }

  .year-box {
    background: var(--soft);
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 22px 22px 8px;
    margin-top: 28px;
  }
  .year-title {
    margin: 0 0 6px;
    font-size: clamp(2.2rem, 6vw, 3.4rem);
    font-weight: 800;
    letter-spacing: -0.05em;
    line-height: 1;
  }
  .year-note {
    margin: 0 0 18px;
    font-size: 12px;
    color: var(--muted);
  }

  .month {
    margin: 0 0 22px;
  }
  .month-title {
    margin: 0 0 10px;
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .month-title .pill {
    display: inline-block;
    margin-left: 8px;
    padding: 2px 10px;
    border-radius: 999px;
    background: #000;
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    vertical-align: middle;
  }

  ul.weeks {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  ul.weeks li {
    margin: 0 0 10px;
  }
  ul.weeks a.week-card {
    display: block;
    text-decoration: none;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 14px 16px;
    transition: opacity 0.15s ease;
  }
  ul.weeks a.week-card:hover { opacity: 0.75; }
  .week-top {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
  }
  .week-day {
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
  }
  .badge.current {
    background: #000;
    color: #fff;
  }
  .badge.archive {
    background: #e8e8e8;
    color: #333;
  }
  .week-meta {
    font-size: 12px;
    color: var(--muted);
  }

  footer.site-foot {
    max-width: var(--max);
    margin: 0 auto;
    padding: 0 20px 48px;
    font-size: 12px;
    color: var(--muted);
  }
</style>
</head>
<body>
  <header class="masthead">
    <h1 class="wordmark">每週爆谷評價</h1>
    <p class="lede">首頁 → 每星期獨立頁。舊期保留喺日期路徑，唔再覆蓋根目錄。</p>
    <hr class="rule">
  </header>

  <main>
    <section class="year-box" aria-labelledby="y2026">
      <h2 id="y2026" class="year-title">2026</h2>
      <p class="year-note">以年分盒；盒內按月 → 星期排列（最新在上）。</p>

      <div class="month">
        <h3 class="month-title">11 月<span class="pill">兩期</span></h3>
        <ul class="weeks">
          <li>
            <a class="week-card" href="2026-11-09/">
              <div class="week-top">
                <span class="week-day">11 月 9 日週</span>
                <span class="badge current">當週</span>
              </div>
              <div class="week-meta">2026-11-09 · 資料錨點約 11/02–11/09</div>
            </a>
          </li>
          <li>
            <a class="week-card" href="2026-11-02/">
              <div class="week-top">
                <span class="week-day">11 月 2 日週</span>
                <span class="badge archive">上星期／存檔</span>
              </div>
              <div class="week-meta">2026-11-02 · 資料錨點約 10/25–11/02</div>
            </a>
          </li>
        </ul>
      </div>
    </section>

    <hr class="thick">
    <p style="font-size:13px;color:var(--muted);margin:12px 0 0;">
      之後每星期會加一個 <code>YYYY-MM-DD/</code> 目錄；首頁會繼續按年／月列出，唔會蓋掉舊期。
    </p>
  </main>

  <footer class="site-foot">
    <hr class="rule" style="margin-bottom:12px;">
    每週爆谷評價 · Asia/Hong_Kong
  </footer>
</body>
</html>
